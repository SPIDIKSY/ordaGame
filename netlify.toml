# Настройки для Netlify. Игра переехала на Amvera — здесь осталась только страница перехода (папка moved).
[build]
  command = "echo moved"
  publish = "moved"
  # Экономия кредитов: каждая выкладка сайта стоит 15 кредитов из 300 в месяц.
  # Сайт собирается, только если в описании последнего изменения есть метка [deploy].
  # Без метки Netlify сборку пропускает — это бесплатно. Предпросмотры (не main) собираются как обычно.
  # Как работает: команда отвечает 0 — «пропустить сборку», 1 — «собирать».
  ignore = "if [ \"$CONTEXT\" != \"production\" ]; then exit 1; fi; git log -1 --pretty=%B | grep -qF '[deploy]' && exit 1 || exit 0"

[build.environment]
  NODE_VERSION = "22"

# Любой старый адрес показывает страницу перехода
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
