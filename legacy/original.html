<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1614">
<meta name="description" content="Бесконечная орда — мини-игра в браузере: выбери героя, уворачивайся от бесконечных волн врагов и прокачивайся.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Бесконечная орда</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Russo+One&display=swap">
<style>
/* Концепт: ночная поляна во весь экран, герой-маг чуть выше центра, закреплённый джойстик внизу.
   Тёмная тема одна и намеренная. Цвета редкости предметов идут как в классических RPG. */
:root {
  --bg: #0f1614;
  --ink: #eef2ef;
  --ink-dim: #9fb0aa;
  --amber: #ffc24a;
  --xp: #5ab8ff;
  --hp: #ff5466;
  --panel: #0e1418;
  --panel-2: #172129;
  --line: #2a3a3c;
  --r0: #c9d1dc;
  --r1: #62d36b;
  --r2: #4aa8ff;
  --r3: #b46cff;
  --r4: #ffb02e;
  --c-attack: #ffc24a;
  --c-def: #5fe0b4;
  --c-move: #b79cff;
  --font-display: 'Russo One', 'Arial Black', Impact, sans-serif;
  --font-body: 'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; }
#c { display: block; touch-action: none; }
.ico { display: block; width: 100%; height: 100%; }

/* ---------- HUD ---------- */
#hud {
  position: absolute; left: 0; right: 0; top: 0; z-index: 2; pointer-events: none;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 8px;
}
.toprow { display: flex; align-items: center; gap: 10px; }
.lvbadge {
  flex: none; width: 44px; height: 44px; border-radius: 50%;
  background: radial-gradient(circle at 50% 30%, #2a3c5c, #121a2a); border: 2px solid var(--xp);
  box-shadow: 0 0 14px -4px var(--xp);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
}
.lvbadge small { font-size: 8px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); font-weight: 600; }
.lvbadge b { font-family: var(--font-display); font-weight: 400; font-size: 17px; font-variant-numeric: tabular-nums; }
.xpbar { flex: 1; min-width: 0; height: 12px; border-radius: 6px; background: rgba(8,12,18,.7); border: 1px solid rgba(255,255,255,.1); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #2f86e8, #7fd3ff); box-shadow: 0 0 10px #5ab8ff; transform-origin: left; transform: scaleX(0); transition: transform .12s; }
#pauseBtn {
  pointer-events: auto; flex: none; width: 44px; height: 44px; border-radius: 12px; padding: 12px;
  border: 1px solid var(--line); background: rgba(14,20,24,.75); color: var(--ink); cursor: pointer;
}
.row2 { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.hpbar { position: relative; height: 20px; border-radius: 10px; background: rgba(8,12,18,.7); border: 1px solid rgba(255,255,255,.1); overflow: hidden; max-width: 210px; }
.hpbar i { position: absolute; inset: 0; background: linear-gradient(180deg, #ff7b88, #d93448); transform-origin: left; transition: transform .1s; }
.hpbar span { position: relative; display: block; text-align: center; font-size: 11px; line-height: 18px; font-weight: 600; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
.timer { font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
.kills { justify-self: end; display: flex; align-items: center; gap: 6px; color: var(--ink); }
.kills span { width: 18px; height: 18px; color: #d7dde6; }
.kills b { font-family: var(--font-display); font-weight: 400; font-size: 17px; font-variant-numeric: tabular-nums; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
.inv { display: flex; flex-wrap: wrap; gap: 6px; }
.slot {
  position: relative; flex: none; width: 30px; height: 30px; padding: 4px; border-radius: 8px;
  background: radial-gradient(circle at 50% 30%, #222d3c, #0b1018); border: 1.5px solid var(--rc, var(--r0));
  color: var(--rc, var(--r0)); box-shadow: 0 0 10px -4px var(--rc, transparent);
}
.slot b {
  position: absolute; right: -5px; bottom: -5px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px;
  background: #0b1018; border: 1px solid var(--rc, var(--r0)); color: var(--ink);
  font-size: 9px; line-height: 13px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums;
}
.slot.big { width: 46px; height: 46px; padding: 8px; border-radius: 12px; }
.buffs { display: flex; flex-wrap: wrap; gap: 6px; }
.buffs:empty { display: none; }
.buff {
  display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 14px;
  background: rgba(10,14,22,.8); border: 1.5px solid var(--bc); color: var(--bc);
  font-size: 12px; font-weight: 600; box-shadow: 0 0 14px -5px var(--bc);
}
.buff .bi { width: 22px; height: 22px; padding: 3px; border-radius: 50%; background: var(--bc); color: #10141c; }
.buff b { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 2.4em; }

#toast {
  position: absolute; left: 0; right: 0; top: 150px; z-index: 2; text-align: center; pointer-events: none;
  font-family: var(--font-display); font-size: 19px; color: var(--amber); text-shadow: 0 2px 10px rgba(0,0,0,.85);
  opacity: 0; transform: translateY(-6px); transition: opacity .25s, transform .25s;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); text-wrap: balance;
}
#toast.show { opacity: 1; transform: none; }
#hint {
  position: absolute; left: 0; right: 0; bottom: 196px; z-index: 2; text-align: center; pointer-events: none;
  color: var(--ink); font-size: 15px; font-weight: 500; text-shadow: 0 1px 6px rgba(0,0,0,.9);
  padding: 0 24px; transition: opacity .6s;
}
#hint.off { opacity: 0; }

/* ---------- экраны ---------- */
.overlay {
  position: absolute; inset: 0; z-index: 5; display: flex; overflow-y: auto;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px));
  background: radial-gradient(ellipse at 50% 40%, rgba(16,26,30,.9), rgba(5,8,12,.95)); text-align: center;
}
.panel { margin: auto; width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.panel.wide { max-width: 780px; }
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; line-height: 1.04; text-wrap: balance; }
h1 { font-size: clamp(34px, 11vw, 54px); color: var(--amber); text-shadow: 0 4px 0 #6b3b00, 0 10px 30px rgba(255,176,46,.35); }
h2 { font-size: clamp(26px, 7vw, 36px); color: var(--amber); }
.lead { margin: 0; color: var(--ink-dim); font-size: 15px; line-height: 1.5; max-width: 36ch; text-wrap: balance; }
.hero-portrait { width: 116px; height: auto; filter: drop-shadow(0 10px 18px rgba(0,0,0,.6)); }
.rules { display: flex; flex-direction: column; gap: 10px; margin: 4px 0; width: 100%; text-align: left; }
.rule { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; font-size: 15px; line-height: 1.35; }
.rule .ic { width: 40px; height: 40px; border-radius: 10px; padding: 8px; background: var(--panel-2); border: 1px solid var(--line); color: var(--amber); }
.rule .ic img { width: 100%; height: 100%; object-fit: contain; }
.rule p { margin: 0; min-width: 0; }
.rule b { color: var(--amber); font-weight: 600; }
.btn {
  font-family: var(--font-display); font-size: 19px; padding: 14px 40px; min-height: 54px; border-radius: 14px;
  border: 0; background: linear-gradient(180deg, #ffd56e, #f5a623); color: #2a1a02; cursor: pointer; margin-top: 4px;
  box-shadow: 0 4px 0 #9a5d06, 0 10px 24px rgba(245,166,35,.25);
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #9a5d06; }
.btn:disabled { opacity: .45; }
.btn:focus-visible, .card:focus-visible, #pauseBtn:focus-visible { outline: 3px solid var(--xp); outline-offset: 3px; }
.best { margin: 0; color: var(--ink-dim); font-size: 14px; font-variant-numeric: tabular-nums; }

/* карточки улучшений */
#cards { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.card {
  display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: center;
  text-align: left; background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1.5px solid var(--line); border-radius: 16px;
  padding: 12px 14px; color: var(--ink); font-family: var(--font-body); cursor: pointer; width: 100%;
}
.card:hover, .card:active { border-color: var(--cc); box-shadow: 0 0 22px -8px var(--cc); }
.card .cico { width: 54px; height: 54px; padding: 10px; border-radius: 14px; background: radial-gradient(circle at 50% 30%, #243041, #0b1018); border: 1.5px solid var(--cc); color: var(--cc); }
.card .ctext { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.card .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
.card .cat { color: var(--cc); }
.card .lv { color: var(--ink-dim); }
.card .name { font-family: var(--font-display); font-size: 18px; }
.card .desc { font-size: 14px; color: var(--ink-dim); line-height: 1.35; }
.cat-attack { --cc: var(--c-attack); }
.cat-def { --cc: var(--c-def); }
.cat-move { --cc: var(--c-move); }
@media (min-width: 720px) {
  #cards { flex-direction: row; }
  .card { flex: 1; grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 18px 14px; }
  .card .meta { justify-content: center; gap: 12px; }
}

/* сундук */
.chest-ov { --rc: var(--r0); background: radial-gradient(ellipse at 50% 38%, rgba(30,24,14,.92), rgba(4,6,10,.97)); }
.stage { position: relative; width: 250px; max-width: 100%; height: 250px; cursor: pointer; }
.stage > * { position: absolute; left: 50%; top: 50%; translate: -50% -50%; }
.rays {
  width: 380px; height: 380px; border-radius: 50%; opacity: 0; transition: opacity .4s;
  background: repeating-conic-gradient(from 0deg, var(--rc) 0deg 7deg, transparent 7deg 22deg);
  -webkit-mask: radial-gradient(circle, #000 0 14%, transparent 62%); mask: radial-gradient(circle, #000 0 14%, transparent 62%);
}
.cglow { width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(circle, var(--rc) 0%, transparent 66%); opacity: .3; animation: pulse .55s ease-in-out infinite alternate; }
.chest-img { width: 150px; height: auto; animation: shake .18s linear infinite; filter: drop-shadow(0 12px 16px rgba(0,0,0,.6)); transition: transform .35s; }
.reveal {
  width: 96px; height: 96px; padding: 16px; border-radius: 24px;
  background: radial-gradient(circle at 50% 30%, #2a3448, #0b1018); border: 2px solid var(--rc); color: var(--rc);
  box-shadow: 0 0 40px -2px var(--rc), inset 0 0 20px -8px var(--rc);
  opacity: 0; transform: translateY(20px) scale(.2); transition: transform .5s cubic-bezier(.2,1.6,.4,1), opacity .2s;
}
.reveal .lvtag { position: absolute; right: -8px; top: -8px; padding: 2px 7px; border-radius: 9px; background: var(--rc); color: #1b1203; font-size: 11px; font-weight: 600; }
.chest-ov.revealed .rays { opacity: .5; animation: spin 16s linear infinite; }
.chest-ov.revealed .cglow { opacity: .55; animation: none; width: 250px; height: 250px; }
.chest-ov.revealed .chest-img { animation: none; transform: translateY(58px) scale(.7); }
.chest-ov.revealed .reveal { opacity: 1; transform: translateY(-40px) scale(1); }
.chest-ov[data-r="3"] .chest-img, .chest-ov[data-r="4"] .chest-img { animation-duration: .1s; }
.cinfo { display: flex; flex-direction: column; align-items: center; gap: 10px; visibility: hidden; opacity: 0; transform: translateY(10px); transition: opacity .3s .2s, transform .3s .2s, visibility 0s .2s; }
.chest-ov.revealed .cinfo { visibility: visible; opacity: 1; transform: none; }
.rar { margin: 0; color: var(--rc); font-size: 13px; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; }
.chest-ov h2 { color: var(--ink); }
.chest-ov[data-r="4"] h2 { color: #ffd36a; text-shadow: 0 0 24px rgba(255,176,46,.6); }
.tap { margin: 0; color: var(--ink-dim); font-size: 14px; }
.chest-ov.revealed .tap { display: none; }
@keyframes shake { 0% { transform: rotate(-3deg) translateX(-2px); } 50% { transform: rotate(3deg) translateX(2px); } 100% { transform: rotate(-3deg) translateX(-2px); } }
@keyframes pulse { from { transform: scale(.85); opacity: .2; } to { transform: scale(1.05); opacity: .45; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* снаряжение на паузе и в итогах */
.invlist { display: flex; flex-direction: column; gap: 8px; width: 100%; text-align: left; max-height: 46vh; overflow-y: auto; }
.invrow { display: grid; grid-template-columns: 46px 1fr; gap: 12px; align-items: center; padding: 6px 4px; }
.invrow .itxt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.invrow .itxt b { font-weight: 600; font-size: 15px; }
.invrow .itxt small { color: var(--ink-dim); font-size: 13px; line-height: 1.3; }
.invrow .itxt em { font-style: normal; color: var(--rc); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
.empty { margin: 0; color: var(--ink-dim); font-size: 14px; }
.sect { margin: 6px 0 0; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-dim); font-weight: 600; align-self: flex-start; }
.stats { display: flex; gap: 24px; justify-content: center; margin: 4px 0; }
.stats div { display: flex; flex-direction: column; gap: 2px; }
.stats small { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); font-weight: 600; }
.stats b { font-family: var(--font-display); font-weight: 400; font-size: 26px; font-variant-numeric: tabular-nums; }
.inv.center { justify-content: center; }

/* полоска босса */
.bossbar { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.bossbar span { font: 400 13px var(--font-display); color: #ecd2ff; letter-spacing: .04em; text-shadow: 0 1px 5px rgba(0,0,0,.85); }
.bb { width: min(300px, 82%); height: 10px; border-radius: 5px; background: rgba(8,12,18,.78); border: 1px solid rgba(208,140,255,.55); overflow: hidden; }
.bb i { display: block; height: 100%; background: linear-gradient(90deg, #b14cff, #ff4a8a); transform-origin: left; box-shadow: 0 0 10px #b14cff; transition: transform .12s; }

/* выбор героя */
.heroes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 440px; }
.hcard {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px 7px; min-width: 0;
  border-radius: 14px; background: var(--panel-2); border: 1.5px solid var(--line); color: var(--ink-dim);
  font: 600 11px var(--font-body); cursor: pointer; transition: transform .15s, border-color .15s;
}
.hcard img { width: 100%; max-width: 52px; height: auto; filter: drop-shadow(0 6px 8px rgba(0,0,0,.5)); }
.hcard.sel { border-color: var(--amber); color: var(--ink); background: linear-gradient(180deg, #2b2414, var(--panel)); box-shadow: 0 0 22px -8px var(--amber); transform: translateY(-3px); }
.hcard.sel img { animation: floaty 2.4s ease-in-out infinite; }
.hcard:focus-visible { outline: 3px solid var(--xp); outline-offset: 2px; }
.hero-info { display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 58px; }
.hero-info p { margin: 0; color: var(--ink-dim); font-size: 14px; line-height: 1.4; max-width: 34ch; text-wrap: balance; }
.hero-info .wpn { display: inline-flex; align-items: center; gap: 6px; color: var(--amber); font-weight: 600; font-size: 14px; }
.hero-info .wpn .ico { width: 18px; height: 18px; }

/* слоты в HUD: 5 оружий | 5 реликвий */
.hudslots { flex-wrap: nowrap; gap: 5px; align-items: center; }
.hudslots .slot { width: 28px; height: 28px; padding: 4px; border-radius: 7px; }
.hudslots .slot b { font-size: 8px; min-width: 13px; height: 13px; line-height: 11px; right: -4px; bottom: -4px; }
.hudslots .sep { width: 2px; height: 22px; margin: 0 3px; border-radius: 1px; background: rgba(255,255,255,.14); flex: none; }
.slot.empty.relic { border-color: rgba(95,224,180,.28); }
.card.relic { border-color: var(--cc); background: linear-gradient(180deg, #13261f, var(--panel)); }
.timer.doom { color: #ff5466; text-shadow: 0 0 14px rgba(255,40,70,.7); animation: doomPulse 1s ease-in-out infinite; }
@keyframes doomPulse { 50% { transform: scale(1.08); } }

/* сундук: перебор предметов, вспышка, конфетти */
.chest-ov .reveal { transition: transform .35s cubic-bezier(.2,1.6,.4,1), opacity .2s, border-color .06s, color .06s, box-shadow .06s; }
.chest-ov.rolling .reveal { opacity: 1; transform: translateY(-40px) scale(1); }
.chest-ov.opened .chest-img { animation: none; transform: translateY(58px) scale(.7); }
.chest-ov.rolling .rays { opacity: .32; animation: spin 2.5s linear infinite; }
.chest-ov.rolling .cglow { opacity: .55; animation: pulse .16s ease-in-out infinite alternate; }
.reveal.tick { animation: tick .14s ease-out; }
@keyframes tick { from { scale: 1.2; } to { scale: 1; } }
.burst { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, var(--rc) 40%, transparent 70%); opacity: 0; pointer-events: none; }
.chest-ov.revealed .burst { animation: burstOut .7s ease-out; }
@keyframes burstOut { 0% { opacity: 1; transform: scale(.5); } 100% { opacity: 0; transform: scale(9); } }
.confetti { width: 0; height: 0; pointer-events: none; }
.confetti i { position: absolute; left: -4px; top: -3px; width: 8px; height: 5px; border-radius: 2px; opacity: 0; animation: conf 1.1s cubic-bezier(.15,.7,.3,1) forwards; }
@keyframes conf { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), calc(var(--dy) + 70px)) rotate(var(--rot)); } }
@media (prefers-reduced-motion: reduce) { .reveal.tick, .burst, .confetti i, .timer.doom, .hcard.sel img { animation: none !important; } }

/* слоты оружия, редкость карточек, переброс */
.inv:empty { display: none; }
.slot.empty { border-style: dashed; border-color: rgba(255,255,255,.22); background: rgba(10,14,22,.4); box-shadow: none; }
.card.r2, .card.r3, .card.r4, .card.weap, .card.wup { border-color: var(--cc); }
.card.weap { background: linear-gradient(180deg, #2b2414, var(--panel)); }
.card.r3 { box-shadow: 0 0 22px -8px var(--cc); }
.card.r4 { background: linear-gradient(180deg, #2e2410, var(--panel)); animation: cardIn .42s cubic-bezier(.2,1.3,.4,1) backwards, legend 1.6s ease-in-out infinite; }
@keyframes legend { 0%, 100% { box-shadow: 0 0 16px -6px var(--cc); } 50% { box-shadow: 0 0 34px -2px var(--cc); } }
.lvactions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
.btn.ghost { display: inline-flex; align-items: center; gap: 10px; background: rgba(255,255,255,.06); color: var(--ink); border: 1.5px solid var(--line); box-shadow: none; font-size: 16px; padding: 10px 22px; min-height: 48px; }
.btn.ghost .ico { width: 20px; height: 20px; color: var(--amber); }
.btn.ghost:active { box-shadow: none; }

/* анимации интерфейса */
@keyframes cardIn { from { opacity: 0; transform: translateY(26px) scale(.92); } to { opacity: 1; transform: none; } }
@keyframes popIn { 0% { transform: scale(.2); opacity: 0; } 65% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); } }
@keyframes panelIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-8px) rotate(1.5deg); } }
@keyframes shimmer { from { background-position: 0 0; } to { background-position: 200% 0; } }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.3); box-shadow: 0 0 28px var(--xp); } 100% { transform: scale(1); } }
@keyframes glowPulse { 0%, 100% { box-shadow: 0 4px 0 #9a5d06, 0 10px 24px rgba(245,166,35,.25); } 50% { box-shadow: 0 4px 0 #9a5d06, 0 10px 38px rgba(245,166,35,.6); } }
@keyframes toastIn { 0% { transform: translateY(-10px) scale(.8); } 60% { transform: scale(1.08); } 100% { transform: none; } }
.card { animation: cardIn .42s cubic-bezier(.2,1.3,.4,1) backwards; transition: transform .15s, border-color .15s, box-shadow .15s; }
.card:nth-child(2) { animation-delay: .08s; }
.card:nth-child(3) { animation-delay: .16s; }
.card:hover { transform: translateY(-3px); }
.card .cico { transition: transform .2s; }
.card:hover .cico { transform: rotate(-8deg) scale(1.1); }
.slot.new { animation: popIn .5s ease-out; }
.buff { animation: popIn .35s ease-out; }
.overlay:not(.chest-ov) .panel { animation: panelIn .3s ease-out; }
.hero-portrait { animation: floaty 2.6s ease-in-out infinite; }
#startBtn, #againBtn { animation: glowPulse 1.8s ease-in-out infinite; }
.xpbar i { background: linear-gradient(90deg, #2f86e8, #8fdcff, #2f86e8) 0 0 / 200% 100%; animation: shimmer 2.4s linear infinite; }
.lvbadge.bump { animation: bump .55s ease-out; }
#toast.show { animation: toastIn .35s ease-out; }

@media (prefers-reduced-motion: reduce) {
  .chest-img, .rays, .cglow, .chest-ov.revealed .rays,
  .card, .slot.new, .buff, .panel, .hero-portrait, #startBtn, #againBtn, .xpbar i, .lvbadge.bump, #toast.show { animation: none !important; }
}

      const d = p.dmg * [0.7, 0.7, 0.95, 0.95, 1.2, 1.2, 1.5][l - 1];
      g.bladeN = n; g.bladeR = R; p.bladeA += (3.2 + 0.15 * l) * dt;
      for (let i = 0; i < n; i++) {
        const a = p.bladeA + i * TAU / n, bx = p.x + Math.cos(a) * R, by = p.y + Math.sin(a) * R;
        for (let j = 0; j < g.enemies.length; j++) {
          const e = g.enemies[j]; if (e.dead || e.bladeCd > 0) continue;
          const dx = e.x - bx, dy = e.y - by, rr = e.r + 10;
          if (dx * dx + dy * dy < rr * rr) { e.bladeCd = 0.3; hitEnemy(e, d, Math.cos(a) * 60, Math.sin(a) * 60); }
        }
      }
    } else g.bladeN = 0;

    // святая аура
    if (g.w.aura) {
      g.wt.aura = (g.wt.aura || 0) - dt;
      if (g.wt.aura <= 0) {
        g.wt.aura = 0.35;
        addFx({ type: 'pulse', life: 0.5, T: 0.5 });
        const R = auraR(), d = p.dmg * (0.3 + 0.15 * g.w.aura);
        for (let i = 0; i < g.enemies.length; i++) {
          const e = g.enemies[i]; if (e.dead) continue;
          if (Math.hypot(e.x - p.x, e.y - p.y) < R + e.r) { hitEnemy(e, d, 0, 0, true); e.slow = Math.max(e.slow, 0.45); }
        }
      }
    }

    // метеориты
    for (let i = 0; i < g.meteors.length; i++) {
      const m = g.meteors[i];
      m.t -= dt;
      if (m.t > 0 && g.parts.length < 260) {
        const k = 1 - m.t / m.T;
        g.parts.push({ x: m.x + (1 - k) * 220 + rnd(-5, 5), y: m.y - (1 - k) * 420 + rnd(-5, 5), vx: rnd(10, 50), vy: rnd(-70, -20), life: 0.45, col: Math.random() < 0.5 ? '#ffb35a' : '#ff6a2e', s: rnd(2, 4.5) });
      }
      if (m.t <= 0 && !m.done) {
        m.done = true;
        for (let j = 0; j < g.enemies.length; j++) {
          const e = g.enemies[j]; if (e.dead) continue;
          const dx = e.x - m.x, dy = e.y - m.y, d = Math.hypot(dx, dy) || 1;
          if (d < m.r + e.r) hitEnemy(e, m.dmg, dx / d * 260, dy / d * 260);
        }
        g.rings.push({ x: m.x, y: m.y, max: m.r, age: 0, life: 0.45, col: '255,140,60' });
        burst(m.x, m.y, '#ffb35a', 22, 260); burst(m.x, m.y, '#ff6a2e', 12, 180);
        addFx({ type: 'decal', x: m.x, y: m.y, r: m.r * 0.8, life: 3, T: 3 });
        for (let k = 0; k < 8; k++) addFx({ type: 'dust', x: m.x + rnd(-m.r * 0.4, m.r * 0.4), y: m.y + rnd(-m.r * 0.3, m.r * 0.3), vx: rnd(-30, 30), vy: rnd(-50, -15), life: 0.9, T: 0.9, r: rnd(8, 14), col: '80,66,62' });
        g.shake = Math.max(g.shake, 0.15);
      }
    }
    g.meteors = g.meteors.filter((m) => !m.done);

    // ядовитые флаконы и лужи
    for (let i = 0; i < g.flasks.length; i++) {
      const f = g.flasks[i]; f.t += dt;
      if (f.t >= f.T && !f.done) {
        f.done = true;
        g.puddles.push({ x: f.tx, y: f.ty, r: f.r, life: f.life, T: f.life, tick: 0, dmg: f.dmg });
        burst(f.tx, f.ty, '#9dff6a', 12, 160); burst(f.tx, f.ty, '#e6ffe0', 5, 100);
        g.rings.push({ x: f.tx, y: f.ty, max: f.r, age: 0, life: 0.35, col: '150,255,110' });
      }
    }
    g.flasks = g.flasks.filter((f) => !f.done);
    for (let i = 0; i < g.puddles.length; i++) {
      const q = g.puddles[i];
      q.life -= dt; q.tick -= dt;
      if (q.tick <= 0) {
        const fire = q.kind === 'fire';
        q.tick = fire ? 0.3 : 0.4;
        for (let j = 0; j < g.enemies.length; j++) {
          const e = g.enemies[j]; if (e.dead) continue;
          const dx = e.x - q.x, dy = (e.y - q.y) / (fire ? 0.55 : 0.62), rr = q.r + e.r;
          if (dx * dx + dy * dy < rr * rr) { hitEnemy(e, q.dmg, 0, 0, true); if (!fire) e.slow = Math.max(e.slow, 0.45); }
        }
      }
    }
    g.puddles = g.puddles.filter((q) => q.life > 0);
  }

  /* --- поведение особых врагов и атаки боссов --- */
  function spawnAt(T, x, y) {
    spawnEnemy(T, 0, 0);
    const e = G.enemies[G.enemies.length - 1]; e.x = x; e.y = y; e.born = 0.3;
    return e;
  }
  function eShoot(e, a, sp, kind) {
    if (G.eshots.length < 220) G.eshots.push({ x: e.x, y: e.y - 6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, kind, r: kind === 'orb' ? 8 : 6, dmg: e.dmg * (kind === 'arrow' ? 0.7 : 0.55), life: 4 });
  }
  function impBoom(e) {
    const g = G, p = g.p, R = 85;
    if (Math.hypot(p.x - e.x, p.y - e.y) < R + p.r && p.inv <= 0) hurtPlayer(e.dmg * 1.6, null);
    g.rings.push({ x: e.x, y: e.y, max: R, age: 0, life: 0.4, col: '255,120,60' });
    burst(e.x, e.y, '#ffb35a', 20, 260); burst(e.x, e.y, '#ff4a2e', 10, 180);
    addFx({ type: 'decal', x: e.x, y: e.y, r: 50, life: 1.5, T: 1.5 });
    g.shake = Math.max(g.shake, 0.12);
    if (!e.dead) killEnemy(e);
  }
  // Возвращает множитель скорости; может задать своё направление через e.mvx / e.mvy
  function enemyAI(e, d, mx, my, dt) {
    const g = G, p = g.p, T = e.T;
    e.atk -= dt;
    switch (T.ai || T.ab) {
      case 'zigzag': { const s = Math.sin(g.t * 6 + e.ph * 3) * 0.9; e.mvx = mx - my * s; e.mvy = my + mx * s; return 1; }
      case 'ranged':
        if (e.atk <= 0 && d < 430) { e.atk = 2.4; eShoot(e, Math.atan2(p.y - e.y, p.x - e.x), 280, 'arrow'); }
        if (d < 200) { e.mvx = -mx; e.mvy = -my; return 0.8; }
        if (d < 270) { e.mvx = -my; e.mvy = mx; return 0.6; }
        return 1;
      case 'bomber':
        if (e.fuse > 0) { e.fuse -= dt; if (Math.floor(e.fuse * 14) % 2 === 0) e.flash = 0.05; if (e.fuse <= 0) impBoom(e); return 0; }
        if (d < 70) { e.fuse = 0.7; return 0; }
        return 1;
      case 'blink':
        if (e.atk <= 0 && d > 150 && d < 650) {
          e.atk = 3.2; burst(e.x, e.y, '#b77cff', 10, 140);
          const k = (d - 95) / d; e.x += (p.x - e.x) * k; e.y += (p.y - e.y) * k;
          burst(e.x, e.y, '#d9b8ff', 12, 160); e.born = 0.4;
        }
        return 1;
      case 'summon':
        if (e.atk <= 0) {
          e.atk = 4;
          for (let i = 0; i < 3; i++) spawnAt(TYPES[0], e.x + rnd(-45, 45), e.y + rnd(-45, 45));
          g.rings.push({ x: e.x, y: e.y, max: 80, age: 0, life: 0.4, col: '200,140,255' });
        }
        return 1;
      case 'slam':
        if (e.cast > 0) {
          e.cast -= dt;
          if (e.cast <= 0) {
            const R = 180;
            if (Math.hypot(p.x - e.x, p.y - e.y) < R && p.inv <= 0) hurtPlayer(e.dmg, null);
            g.rings.push({ x: e.x, y: e.y, max: R, age: 0, life: 0.5, col: '160,210,255' });
            g.rings.push({ x: e.x, y: e.y, max: R * 0.6, age: 0, life: 0.35, col: '255,255,255' });
            burst(e.x, e.y, '#bfe6ff', 30, 300);
            addFx({ type: 'decal', x: e.x, y: e.y, r: 120, life: 2, T: 2 });
            g.shake = Math.max(g.shake, 0.35);
          }
          return 0;
        }
        if (e.atk <= 0 && d < 420) { e.atk = 5; e.cast = 1.1; }
        return 1;
      case 'brood':
        if (e.atk <= 0) {
          e.atk = 3.2;
          if (Math.random() < 0.5) { for (let i = 0; i < 3; i++) spawnAt(SPIDER, e.x + rnd(-30, 30), e.y + rnd(-30, 30)); }
          else { const a = Math.atan2(p.y - e.y, p.x - e.x); for (let i = -2; i <= 2; i++) eShoot(e, a + i * 0.22, 220, 'web'); }
        }
        return 1;
      case 'bullets':
        if (e.atk <= 0) {
          e.atk = 2.8; e.wave = (e.wave || 0) + 1;
          if (e.wave % 3 === 0) { for (let i = 0; i < 4; i++) spawnAt(GHOST, e.x + rnd(-60, 60), e.y + rnd(-60, 60)); }
          else { const n = 14, off = Math.random() * TAU; for (let i = 0; i < n; i++) eShoot(e, off + i * TAU / n, 170, 'orb'); }
        }
        return 1;
    }
    return 1;
  }

  /* --- раздвигаем врагов, чтобы не слипались --- */
  const sgrid = new Map();
  function separate(dt) {
    const E = G.enemies, cs = 40;
    sgrid.clear();
    for (let i = 0; i < E.length; i++) {
      const e = E[i]; e.cx = Math.floor(e.x / cs); e.cy = Math.floor(e.y / cs);
      const k = e.cx * 100003 + e.cy, a = sgrid.get(k);
      if (a) a.push(e); else sgrid.set(k, [e]);
    }
    for (let i = 0; i < E.length; i++) {
      const e = E[i]; let px = 0, py = 0;
      for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
        const a = sgrid.get((e.cx + ox) * 100003 + (e.cy + oy)); if (!a) continue;
        for (let j = 0; j < a.length; j++) {
          const o = a[j]; if (o === e) continue;
          const dx = e.x - o.x, dy = e.y - o.y, md = (e.r + o.r) * 0.85, d2 = dx * dx + dy * dy;
          if (d2 < md * md) {
            if (d2 > 0.01) { const d = Math.sqrt(d2), f = (md - d) / md; px += dx / d * f; py += dy / d * f; }
            else { px += Math.random() - 0.5; py += Math.random() - 0.5; }
          }
        }
      }
      e.x += px * 90 * dt; e.y += py * 90 * dt;
    }
  }

  /* =====================================================
     ОБНОВЛЕНИЕ
     ===================================================== */
  function update(dt) {
    const g = G, p = g.p, t = (g.t += dt);

    let ix = 0, iy = 0;
    if (keys.size) {
      ix = (keys.has('right') ? 1 : 0) - (keys.has('left') ? 1 : 0);
      iy = (keys.has('down') ? 1 : 0) - (keys.has('up') ? 1 : 0);
      const m = Math.hypot(ix, iy); if (m > 1) { ix /= m; iy /= m; }
    } else { ix = stick.vx; iy = stick.vy; }
    const hasteK = (g.buffs.haste > 0 ? 1.4 : 1) * (p.webT > 0 ? 0.6 : 1);
    if (p.webT > 0) p.webT -= dt;
    p.x += ix * p.speed * hasteK * dt; p.y += iy * p.speed * hasteK * dt;
    p.moving = Math.hypot(ix, iy) > 0.05;
    if (p.moving) { p.walkT += dt * (0.6 + Math.hypot(ix, iy) * 0.6); const m = Math.hypot(ix, iy); p.dirX = ix / m; p.dirY = iy / m; }
    if (ix > 0.2) p.face = 1; else if (ix < -0.2) p.face = -1;
    p.hp = Math.min(p.maxHp, p.hp + p.regen * dt);
    if (p.inv > 0) p.inv -= dt;
    if (p.hurt > 0) p.hurt -= dt;
    if (p.castT > 0) p.castT -= dt;
    if (p.moving) {
      g.dustT -= dt;
      if (g.dustT <= 0) {
        const fast = g.buffs.haste > 0;
        g.dustT = fast ? 0.06 : 0.13;
        addFx({ type: 'dust', x: p.x + rnd(-5, 5), y: p.y + 17, vx: -ix * 30, vy: -iy * 20 - 8, life: 0.45, T: 0.45, r: rnd(3, 5), col: fast ? '122,240,192' : '170,190,170' });
      }
    }

    while (g.unlocked < TYPES.length && t >= TYPES[g.unlocked].from) { toast('Новый враг: ' + TYPES[g.unlocked].name); g.unlocked++; }

    // Волна смерти
    if (!g.doomWarn && t >= DOOM_T - 30) { g.doomWarn = true; toast('Через 30 секунд начнётся Волна смерти!'); }
    if (!g.doom && t >= DOOM_T) { g.doom = true; g.flash = 0.35; g.shake = 0.6; toast('ВОЛНА СМЕРТИ! Враги сильнее с каждой минутой'); }
    if (g.doom) {
      const m = Math.floor((t - DOOM_T) / 60);
      if (m > g.doomMin) { g.doomMin = m; g.shake = 0.3; toast('Волна смерти усилилась: ' + (m + 1) + '-я минута'); }
    }
    g.vampBank = Math.min(p.maxHp * 0.04, g.vampBank + p.maxHp * 0.03 * dt);

    const maxE = g.doom ? 320 : MAXE;
    const rate = g.doom ? 16 + (t - DOOM_T) / 60 * 5 : Math.min(13, 0.9 + t * 0.028);
    if (g.enemies.length < maxE) {
      g.spawnAcc += rate * dt;
      while (g.spawnAcc >= 1) { g.spawnAcc -= 1; spawnEnemy(g.doom && Math.random() < 0.35 ? DOOM : pickType(t)); }
    } else g.spawnAcc = 0;

    g.waveT -= dt;
    if (g.waveT <= 0) {
      g.waveT = 28;
      const n = Math.min(40, Math.round(10 + t / 9)), a = Math.random() * TAU, T = pickType(t), d = spawnDist() + 10;
      for (let i = 0; i < n && g.enemies.length < MAXE + 60; i++) spawnEnemy(T, a + rnd(-0.45, 0.45), d + Math.random() * 60);
      toast('Волна врагов!');
    }
    g.eliteT -= dt;
    if (g.eliteT <= 0) {
      g.eliteT = 50;
      spawnEnemy(TYPES[Math.max(0, g.unlocked - 1 - Math.floor(Math.random() * Math.min(2, g.unlocked)))], undefined, undefined, true);
      toast('Элитный враг! Победи его и получи сундук');
    }
    g.bossT -= dt;
    if (g.bossT <= 0) { g.bossT = 150; const Bs = BOSSES[g.bossN % BOSSES.length]; g.bossN++; spawnEnemy(Bs); g.shake = 0.3; toast('Появился босс: ' + Bs.name); }

    const far = spawnDist() + 480;
    for (let i = 0; i < g.enemies.length; i++) {
      const e = g.enemies[i];
      const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
      let sp = e.spd * (e.slow > 0 ? 0.5 : 1), mx = dx / d, my = dy / d;
      if (e.T.ai || e.T.ab) {
        sp *= enemyAI(e, d, mx, my, dt);
        if (e.mvx !== undefined) { mx = e.mvx; my = e.mvy; e.mvx = undefined; }
      }
      e.x += (mx * sp + e.kx) * dt; e.y += (my * sp + e.ky) * dt;
      const decay = Math.max(0, 1 - 8 * dt); e.kx *= decay; e.ky *= decay;
      if (e.flash > 0) e.flash -= dt;
      if (e.born < 1) e.born = Math.min(1, e.born + dt / 0.35);
      if (e.sq > 0) e.sq = Math.max(0, e.sq - dt * 6);
      if (e.hitCd > 0) e.hitCd -= dt;
      if (e.bladeCd > 0) e.bladeCd -= dt;
      if (e.slow > 0) e.slow -= dt;
      if (d > far && !e.T.boss && !e.elite) { const a = Math.random() * TAU, rr = spawnDist(); e.x = p.x + Math.cos(a) * rr; e.y = p.y + Math.sin(a) * rr; }
      if (d < e.r + p.r && e.hitCd <= 0 && p.inv <= 0 && state === 'play') {
        e.hitCd = 0.6;
        if (Math.random() < Math.min(0.4, p.dodge)) { pop(p.x, p.y - 30, 'Уклон', '#9fe8ff', false); p.inv = 0.15; }
        else hurtPlayer(e.dmg, e);
      }
    }
    separate(dt);
    updateWeapons(dt);

    // снаряды: движение и попадания
    for (let i = 0; i < g.shots.length; i++) {
      const s = g.shots[i];
      if (s.kind === 'axe') { s.vy += s.grav * dt; s.rot += s.spin * dt; }
      else if (s.kind === 'boom') {
        s.rot += 18 * dt;
        if (!s.back) {
          s.v -= 900 * dt;
          if (s.v <= 0) { s.back = true; s.hit = []; s.v = 0; }
          s.vx = s.dx * s.v; s.vy = s.dy * s.v;
        } else {
          s.v = Math.min(900, s.v + 1100 * dt);
          const ddx = p.x - s.x, ddy = p.y - 6 - s.y, dl = Math.hypot(ddx, ddy) || 1;
          s.vx = ddx / dl * s.v; s.vy = ddy / dl * s.v;
          if (dl < 20) s.life = 0;
        }
      }
      else if (s.kind === 'wisp') {
        if (!s.tgt || s.tgt.dead) s.tgt = nearest(s.x, s.y, 520);
        if (s.tgt) {
          const want = Math.atan2(s.tgt.y - s.y, s.tgt.x - s.x), cur = Math.atan2(s.vy, s.vx);
          let da = want - cur; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
          const na = cur + Math.max(-7 * dt, Math.min(7 * dt, da));
          s.vx = Math.cos(na) * s.spd; s.vy = Math.sin(na) * s.spd;
        }
      }
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      if (s.life <= 0) continue;
      if (g.parts.length < 220 && Math.random() < TRAIL[s.kind]) g.parts.push({ x: s.x, y: s.y, vx: rnd(-20, 20), vy: rnd(-20, 20), life: 0.22, col: TRAILC[s.kind], s: s.kind === 'fire' ? 3.5 : 2.2 });
      for (let j = 0; j < g.enemies.length; j++) {
        const e = g.enemies[j]; if (e.dead) continue;
        const dx = e.x - s.x, dy = e.y - s.y, rr = e.r + s.r;
        if (dx * dx + dy * dy < rr * rr && s.hit.indexOf(e.id) < 0) {
          s.hit.push(e.id);
          if (s.kind === 'fire') { explode(s.x, s.y, s.boom, s.dmg); s.life = 0; break; }
          addFx({ type: 'hit', x: s.x, y: s.y, life: 0.16, T: 0.16, col: s.kind === 'frost' ? '#d8f6ff' : s.kind === 'wisp' ? '#e2c9ff' : '#ffe2a0' });
          const k = 90 / (1 + e.r / 14), l = Math.hypot(s.vx, s.vy) || 1;
          if (s.kind === 'frost') { e.slow = 1.6; burst(s.x, s.y, '#d8f6ff', 3, 90); }
          hitEnemy(e, s.dmg, s.vx / l * k, s.vy / l * k);
          if (s.pierce-- <= 0) { s.life = 0; break; }
        }
      }
    }

    // снаряды врагов
    for (let i = 0; i < g.eshots.length; i++) {
      const s = g.eshots[i]; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      if (s.life > 0 && p.inv <= 0 && state === 'play' && Math.hypot(s.x - p.x, s.y - p.y) < s.r + p.r - 2) {
        s.life = 0;
        if (Math.random() < Math.min(0.4, p.dodge)) pop(p.x, p.y - 30, 'Уклон', '#9fe8ff', false);
        else { hurtPlayer(s.dmg, null); if (s.kind === 'web') { p.webT = 1.6; pop(p.x, p.y - 30, 'Паутина', '#e2c9ff', false); } }
      }
    }
    g.eshots = g.eshots.filter((s) => s.life > 0);

    for (let i = 0; i < g.gems.length; i++) {
      const gm = g.gems[i];
      const dx = p.x - gm.x, dy = p.y - gm.y, d = Math.hypot(dx, dy) || 1;
      if (!gm.mag && d < p.magnet) gm.mag = true;
      if (gm.mag) { gm.sp = Math.min(700, gm.sp + 1400 * dt); gm.x += dx / d * (240 + gm.sp) * dt; gm.y += dy / d * (240 + gm.sp) * dt; }
      if (d < p.r + 9) {
        gm.take = true;
        if (gm.type === 'heart') { p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.2); pop(p.x, p.y - 26, '+HP', '#ff8d8d', false); }
        else {
          addXp(gm.v);
          if (g.fx.length < 120) addFx({ type: 'hit', x: gm.x, y: gm.y, life: 0.14, T: 0.14, small: true, col: gm.tier === 0 ? '#9fd6ff' : gm.tier === 1 ? '#9fffc0' : '#ffaabb' });
        }
      }
    }
    for (let i = 0; i < g.pickups.length; i++) {
      const q = g.pickups[i]; q.life -= dt;
      if (q.life <= 0) { q.take = true; continue; }
      if (!q.take && Math.hypot(p.x - q.x, p.y - q.y) < p.r + 16) { q.take = true; usePickup(q); }
    }
    g.pickups = g.pickups.filter((q) => !q.take);
    for (const k in g.buffs) if (g.buffs[k] > 0) g.buffs[k] = Math.max(0, g.buffs[k] - dt);
    if (g.flash > 0) g.flash -= dt;
    if (g.shake > 0) g.shake -= dt;
    if (g.buffs.haste > 0 && p.moving && g.parts.length < 260) g.parts.push({ x: p.x + rnd(-6, 6), y: p.y + rnd(-4, 14), vx: -ix * 60, vy: -iy * 60, life: 0.3, col: '#7af0c0', s: 3 });
    if (g.buffs.rage > 0 && g.parts.length < 260 && Math.random() < 0.4) g.parts.push({ x: p.x + rnd(-12, 12), y: p.y + rnd(-10, 14), vx: rnd(-10, 10), vy: rnd(-80, -40), life: 0.4, col: '#ff7a4a', s: 2.5 });

    let chestHit = null;
    for (let i = 0; i < g.chests.length; i++) {
      const c = g.chests[i]; c.t += dt;
      if (!chestHit && Math.hypot(p.x - c.x, p.y - c.y) < p.r + 18) { chestHit = c; c.take = true; }
    }

    g.enemies = g.enemies.filter((e) => !e.dead);
    g.shots = g.shots.filter((s) => s.life > 0);
    g.gems = g.gems.filter((q) => !q.take);
    g.chests = g.chests.filter((q) => !q.take);
    for (let i = 0; i < g.parts.length; i++) { const q = g.parts[i]; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.9; q.vy *= 0.9; q.life -= dt; }
    g.parts = g.parts.filter((q) => q.life > 0);
    for (let i = 0; i < g.corpses.length; i++) g.corpses[i].t += dt;
    g.corpses = g.corpses.filter((q) => q.t < q.life);
    for (let i = 0; i < g.fx.length; i++) { const q = g.fx[i]; q.life -= dt; if (q.vx !== undefined) { q.x += q.vx * dt; q.y += q.vy * dt; } }
    g.fx = g.fx.filter((q) => q.life > 0);
    if (g.lvlFx > 0) g.lvlFx -= dt;
    if (g.hurtFx > 0) g.hurtFx -= dt;
    for (let i = 0; i < g.texts.length; i++) { const q = g.texts[i]; q.y -= 42 * dt; q.life -= dt; }
    g.texts = g.texts.filter((q) => q.life > 0);
    for (let i = 0; i < g.rings.length; i++) g.rings[i].age += dt;
    g.rings = g.rings.filter((q) => q.age < q.life);
    for (let i = 0; i < g.bolts.length; i++) g.bolts[i].life -= dt;
    g.bolts = g.bolts.filter((q) => q.life > 0);
    if (g.toastT > 0) { g.toastT -= dt; if (g.toastT <= 0) $('toast').classList.remove('show'); }

    if (state === 'play' && chestHit) openChest(chestHit.kind);
    else if (state === 'play' && g.pending > 0) {
      if (!g.lvlArm) {
        g.lvlArm = true; g.lvlFx = 0.6;
        g.rings.push({ x: p.x, y: p.y, max: 160, age: 0, life: 0.55, col: '255,214,110' });
        burst(p.x, p.y, '#ffe08a', 28, 260);
      } else if (g.lvlFx <= 0) openLevelUp();
    }
  }

  /* =====================================================
     СУНДУКИ И НАГРАДЫ
     ===================================================== */
  const WEIGHTS = { normal: [58, 26, 11, 4, 1.2], elite: [34, 32, 20, 10, 4], boss: [0, 20, 38, 27, 15] };
  function rollRarity(kind) {
    const L = G.p.luck, base = WEIGHTS[kind] || WEIGHTS.normal;
    const w = base.map((v, i) => v * Math.pow(1 + L, i));
    let r = Math.random() * w.reduce((a, b) => a + b, 0);
    for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return i; }
    return 0;
  }
  function rollReward(kind) {
    const g = G, r = rollRarity(kind);
    if (r === 4 && Math.random() < 0.6) {
      const owned = g.wOrder.filter((id) => g.w[id] < WMAX);
      const fresh = g.wOrder.length < MAX_WEAPONS ? WEAPONS.filter((Wd) => !g.w[Wd.id]).map((Wd) => Wd.id) : [];
      const pool = fresh.length && (Math.random() < 0.5 || !owned.length) ? fresh : owned;
      if (pool.length) { const id = pool[Math.floor(Math.random() * pool.length)]; return { type: 'weapon', r, wp: WDEF[id], lvl: (g.w[id] || 0) + 1 }; }
    }
    const pool = ITEMS.filter((it) => (it.minR || 0) <= r);
    const it = pool[Math.floor(Math.random() * pool.length)];
    return { type: 'item', r, it, eff: it.fixed ? Object.assign({}, it.eff) : scaleEff(it.eff, RAR[r].mult) };
  }
  function applyReward(rw) {
    const g = G;
    if (rw.type === 'weapon') {
      const id = rw.wp.id;
      if (!g.w[id]) { g.wOrder.push(id); g.wt[id] = 0.4; }
      g.w[id] = rw.lvl;
    } else {
      applyEff(g.p, rw.eff);
      let k = g.inv[rw.it.id];
      if (!k) { k = g.inv[rw.it.id] = { count: 0, total: {}, best: 0 }; g.invOrder.push(rw.it.id); }
      k.count++; addEff(k.total, rw.eff); k.best = Math.max(k.best, rw.r);
    }
    renderInv(rw.type === 'weapon' ? 'w:' + rw.wp.id : rw.it.id);
  }

  /* --- открытие сундука: тряска, перебор предметов, вспышка --- */
  let curReward = null, chestTimers = [];
  const clearChestTimers = () => { chestTimers.forEach(clearTimeout); chestTimers = []; };
  const ROLL_ICONS = Array.from(new Set(ITEMS.map((i) => i.icon).concat(WEAPONS.map((w) => w.icon))));
  function rewardIcon(rw) { return rw.type === 'weapon' ? rw.wp.icon : rw.it.icon; }
  function openChest(kind) {
    state = 'chest'; stickReset(); hideHint();
    curReward = rollReward(kind);
    const rw = curReward, el = $('chest');
    el.classList.remove('revealed', 'rolling', 'opened');
    el.dataset.r = rw.r;
    el.style.setProperty('--rc', RAR[0].col);
    $('chestImg').src = CHEST_URL;
    $('reveal').innerHTML = ''; $('confetti').innerHTML = '';
    $('cRar').textContent = RAR[rw.r].name + (rw.type === 'weapon' ? (rw.lvl > 1 ? ' · усиление оружия' : ' · новое оружие') : ' · предмет');
    if (rw.type === 'weapon') {
      $('cName').textContent = rw.wp.name;
      $('cDesc').textContent = rw.lvl === 1 ? rw.wp.desc : 'Уровень ' + rw.lvl + ' из ' + WMAX + ': ' + rw.wp.lv[rw.lvl - 2].toLowerCase() + '.';
    } else {
      $('cName').textContent = rw.it.name;
      $('cDesc').textContent = effText(rw.eff) + '. Действует до конца забега.';
    }
    $('takeBtn').disabled = true;
    el.hidden = false;
    clearChestTimers();
    chestTimers.push(setTimeout(startRoll, 650));
  }
  function startRoll() {
    const el = $('chest'), rw = curReward;
    if (!rw || el.hidden || el.classList.contains('revealed')) return;
    el.classList.add('opened', 'rolling');
    $('chestImg').src = CHEST_OPEN_URL;
    const total = 18 + rw.r * 3, box = $('reveal');
    let n = 0;
    const tick = () => {
      n++;
      if (n >= total) { revealChest(); return; }
      // цвета редкости мигают; к концу чаще выпадает настоящий
      const k = n / total;
      const rr = Math.random() < k * 0.6 ? rw.r : Math.min(4, Math.floor(Math.random() * (rw.r + 2)));
      el.style.setProperty('--rc', RAR[rr].col);
      box.innerHTML = svg(ROLL_ICONS[Math.floor(Math.random() * ROLL_ICONS.length)]);
      box.classList.remove('tick'); void box.offsetWidth; box.classList.add('tick');
      chestTimers.push(setTimeout(tick, 40 + 260 * Math.pow(k, 2.4)));
    };
    tick();
  }
  function revealChest() {
    const el = $('chest'), rw = curReward;
    if (!rw || el.hidden || el.classList.contains('revealed')) return;
    clearChestTimers();
    el.classList.remove('rolling'); el.classList.add('opened', 'revealed');
    $('chestImg').src = CHEST_OPEN_URL;
    el.style.setProperty('--rc', RAR[rw.r].col);
    const box = $('reveal');
    box.innerHTML = svg(rewardIcon(rw)) + (rw.type === 'weapon' && rw.lvl > 1 ? '<span class="lvtag">ур. ' + rw.lvl + '</span>' : '');
    box.classList.remove('tick'); void box.offsetWidth; box.classList.add('tick');
    const cols = [RAR[rw.r].col, '#ffffff', '#ffd56e'], n = 18 + rw.r * 7;
    let h = '';
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, d = 80 + Math.random() * 120;
      h += '<i style="--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d - 40) + 'px;--rot:' + Math.round(rnd(-400, 400)) +
        'deg;background:' + cols[i % 3] + ';animation-delay:' + Math.round(Math.random() * 140) + 'ms"></i>';
    }
    $('confetti').innerHTML = h;
    chestTimers.push(setTimeout(() => { $('takeBtn').disabled = false; }, 500));
  }
  $('chestStage').addEventListener('click', () => {
    const el = $('chest');
    if (el.classList.contains('revealed')) return;
    if (!el.classList.contains('opened')) { clearChestTimers(); startRoll(); clearChestTimers(); }
    revealChest();
  });
  $('takeBtn').addEventListener('click', () => {
    if (state !== 'chest' || !curReward) return;
    applyReward(curReward);
    const rw = curReward; curReward = null;
    clearChestTimers(); $('confetti').innerHTML = '';
    $('chest').hidden = true; state = 'play';
    toast(rw.type === 'weapon' ? rw.wp.name + (rw.lvl > 1 ? ': уровень ' + rw.lvl : ' в деле!') : rw.it.name + ': ' + effText(rw.eff));
    if (G.pending > 0) openLevelUp();
  });

  /* --- оружие, реликвии и предметы в HUD, на паузе и в итогах --- */
  function slotHTML(icon, r, badge, big, isNew, col) {
    return '<span class="slot' + (big ? ' big' : '') + (isNew ? ' new' : '') + '" style="--rc:' + (col || RAR[r].col) + '">' + svg(icon) + (badge ? '<b>' + badge + '</b>' : '') + '</span>';
  }
  function weaponSlots(newId) {
    let h = '';
    for (let i = 0; i < MAX_WEAPONS; i++) {
      const id = G.wOrder[i];
      h += id ? slotHTML(WDEF[id].icon, 4, G.w[id] >= WMAX ? 'MAX' : G.w[id], false, newId === 'w:' + id) : '<span class="slot empty"></span>';
    }
    return h;
  }
  function relicSlots(newId) {
    let h = '';
    for (let i = 0; i < MAX_RELICS; i++) {
      const id = G.rOrder[i];
      h += id ? slotHTML(RDEF[id].icon, 0, G.r[id] >= RMAX ? 'MAX' : G.r[id], false, newId === 'r:' + id, RCOL) : '<span class="slot empty relic"></span>';
    }
    return h;
  }
  function itemSlots(newId) {
    let h = '';
    G.invOrder.forEach((id) => { const it = ITEMS.find((q) => q.id === id), k = G.inv[id]; h += slotHTML(it.icon, k.best, k.count > 1 ? '×' + k.count : '', false, newId === id); });
    return h;
  }
  function renderInv(newId) {
    $('wslots').innerHTML = weaponSlots(newId) + '<span class="sep"></span>' + relicSlots(newId);
    $('inv').innerHTML = itemSlots(newId);
  }
  function invRow(icon, r, em, name, small, col) {
    return '<div class="invrow" style="--rc:' + (col || RAR[r].col) + '">' + slotHTML(icon, r, '', true, false, col) +
      '<span class="itxt"><em>' + em + '</em><b>' + name + '</b><small>' + small + '</small></span></div>';
  }
  function renderPauseInv() {
    let h = '<p class="sect">Оружие · ' + G.wOrder.length + ' из ' + MAX_WEAPONS + '</p>';
    G.wOrder.forEach((id) => { const Wd = WDEF[id]; h += invRow(Wd.icon, 4, 'ур. ' + G.w[id] + ' из ' + WMAX, Wd.name, Wd.desc); });
    h += '<p class="sect">Реликвии · ' + G.rOrder.length + ' из ' + MAX_RELICS + '</p>';
    if (!G.rOrder.length) h += '<p class="empty">Реликвии появляются среди карточек нового уровня.</p>';
    G.rOrder.forEach((id) => { const R = RDEF[id], n = G.r[id]; h += invRow(R.icon, 0, 'ур. ' + n + ' из ' + RMAX, R.name, effText(scaleEff(R.eff, n)), RCOL); });
    if (G.stOrder.length) {
      h += '<p class="sect">Характеристики</p>';
      G.stOrder.forEach((id) => { const S = SDEF[id], k = G.st[id]; h += invRow(S.icon, k.best, 'ур. ' + k.n + ' из ' + S.max, S.name, effText(k.total)); });
    }
    if (G.invOrder.length) {
      h += '<p class="sect">Предметы из сундуков</p>';
      G.invOrder.forEach((id) => {
        const it = ITEMS.find((q) => q.id === id), k = G.inv[id];
        h += invRow(it.icon, k.best, k.count > 1 ? 'Собрано: ' + k.count + ' шт.' : RAR[k.best].name, it.name, effText(k.total));
      });
    }
    $('pauseInv').innerHTML = h;
  }

  /* =====================================================
     НОВЫЙ УРОВЕНЬ: ОРУЖИЕ, РЕЛИКВИИ, ХАРАКТЕРИСТИКИ, ПЕРЕБРОС
     ===================================================== */
  let curChoices = [];
  function rollStatRarity() {
    const L = G.p.luck, w = [60, 25, 10, 4, 1].map((v, i) => v * Math.pow(1 + L, i));
    let r = Math.random() * w.reduce((a, b) => a + b, 0);
    for (let i = 0; i < 5; i++) { r -= w[i]; if (r <= 0) return i; }
    return 0;
  }
  function buildChoices() {
    const g = G, pool = [];
    g.wOrder.forEach((id) => { if (g.w[id] < WMAX) pool.push({ type: 'wup', id, w: 3 }); });
    if (g.wOrder.length < MAX_WEAPONS) WEAPONS.forEach((Wd) => { if (!g.w[Wd.id]) pool.push({ type: 'wnew', id: Wd.id, w: 1.1 }); });
    g.rOrder.forEach((id) => { if (g.r[id] < RMAX) pool.push({ type: 'rup', id, w: 2 }); });
    if (g.rOrder.length < MAX_RELICS) RELICS.forEach((R) => { if (!g.r[R.id]) pool.push({ type: 'rnew', id: R.id, w: 0.9 }); });
    STATS.forEach((S) => { const n = g.st[S.id] ? g.st[S.id].n : 0; if (n < S.max) pool.push({ type: 'stat', id: S.id, w: S.fixed ? 0.3 : 0.8 }); });
    const out = [];
    while (out.length < 3 && pool.length) {
      let r = Math.random() * pool.reduce((a, b) => a + b.w, 0), idx = 0;
      for (; idx < pool.length - 1; idx++) { r -= pool[idx].w; if (r <= 0) break; }
      const c = pool.splice(idx, 1)[0];
      if (c.type === 'stat') {
        const S = SDEF[c.id];
        c.r = Math.max(rollStatRarity(), S.minR || 0);
        c.eff = S.fixed ? Object.assign({}, S.eff) : scaleEff(S.eff, RAR[c.r].mult);
      }
      out.push(c);
    }
    if (!out.length) out.push({ type: 'heal' });
    return out;
  }
  function cardParts(c) {
    let cc, cat, lv, icon, name, desc, cls = '';
    if (c.type === 'wnew' || c.type === 'wup') {
      const Wd = WDEF[c.id], n = G.w[c.id] || 0;
      icon = Wd.icon; name = Wd.name;
      if (c.type === 'wnew') { cc = '#ffb02e'; cat = 'Новое оружие'; lv = 'слот ' + (G.wOrder.length + 1) + ' из ' + MAX_WEAPONS; desc = Wd.desc; cls = ' weap'; }
      else { cc = '#ffd56e'; cat = 'Оружие'; lv = 'ур. ' + (n + 1) + ' из ' + WMAX; desc = Wd.lv[n - 1]; cls = ' wup'; }
    } else if (c.type === 'rnew' || c.type === 'rup') {
      const R = RDEF[c.id], n = G.r[c.id] || 0;
      cc = RCOL; icon = R.icon; name = R.name; desc = (c.type === 'rnew' ? '' : 'Ещё ') + effText(R.eff); cls = ' relic';
      if (c.type === 'rnew') { cat = 'Новая реликвия'; lv = 'слот ' + (G.rOrder.length + 1) + ' из ' + MAX_RELICS; }
      else { cat = 'Реликвия'; lv = 'ур. ' + (n + 1) + ' из ' + RMAX; }
    } else if (c.type === 'stat') {
      const S = SDEF[c.id], n = G.st[c.id] ? G.st[c.id].n : 0;
      cc = RAR[c.r].col; icon = S.icon; name = S.name; cat = RAR[c.r].name; lv = 'ур. ' + (n + 1) + ' из ' + S.max; desc = effText(c.eff); cls = ' r' + c.r;
    } else { cc = '#ff7a8a'; icon = 'heart'; name = 'Лечение'; cat = 'Всё прокачано'; lv = ''; desc = 'Восстановить 50 здоровья.'; }
    return { cc, cls, html: '<span class="cico">' + svg(icon) + '</span><span class="ctext"><span class="meta"><span class="cat">' + cat +
      '</span><span class="lv">' + lv + '</span></span><span class="name">' + name + '</span><span class="desc">' + desc + '</span></span>' };
  }
  function renderChoices() {
    const box = $('cards'); box.innerHTML = '';
    curChoices.forEach((c) => {
      const h = cardParts(c), b = document.createElement('button');
      b.type = 'button'; b.className = 'card' + h.cls; b.style.setProperty('--cc', h.cc); b.innerHTML = h.html;
      b.addEventListener('click', () => pickChoice(c));
      box.appendChild(b);
    });
    const rb = $('rerollBtn');
    rb.innerHTML = svg('reroll') + 'Перебросить · ' + G.rerolls;
    rb.disabled = G.rerolls <= 0;
  }
  function openLevelUp() {
    G.lvlArm = false; G.lvlFx = 0; hideHint();
    state = 'levelup'; stickReset(); acceptAt = performance.now() + 350;
    curChoices = buildChoices(); renderChoices();
    $('levelup').hidden = false;
  }
  function pickChoice(c) {
    if (performance.now() < acceptAt || state !== 'levelup') return;
    const g = G, p = g.p;
    if (c.type === 'wnew') { g.w[c.id] = 1; g.wOrder.push(c.id); g.wt[c.id] = 0.3; renderInv('w:' + c.id); }
    else if (c.type === 'wup') { g.w[c.id]++; renderInv('w:' + c.id); }
    else if (c.type === 'rnew') { g.r[c.id] = 1; g.rOrder.push(c.id); applyEff(p, RDEF[c.id].eff); renderInv('r:' + c.id); }
    else if (c.type === 'rup') { g.r[c.id]++; applyEff(p, RDEF[c.id].eff); renderInv('r:' + c.id); }
    else if (c.type === 'stat') {
      applyEff(p, c.eff);
      let k = g.st[c.id];
      if (!k) { k = g.st[c.id] = { n: 0, total: {}, best: 0 }; g.stOrder.push(c.id); }
      k.n++; addEff(k.total, c.eff); k.best = Math.max(k.best, c.r);
    } else p.hp = Math.min(p.maxHp, p.hp + 50);
    g.pending--;
    if (g.pending > 0) openLevelUp(); else { $('levelup').hidden = true; state = 'play'; }
  }
  $('rerollBtn').addEventListener('click', () => {
    if (state !== 'levelup' || G.rerolls <= 0) return;
    G.rerolls--; acceptAt = performance.now() + 250;
    curChoices = buildChoices(); renderChoices();
  });

  /* =====================================================
     ЭКРАНЫ
     ===================================================== */
  function readBest() { try { return Number(localStorage.getItem('orda-best')) || 0; } catch (_) { return 0; } }
  function writeBest(v) { try { localStorage.setItem('orda-best', String(v)); } catch (_) {} }
  function showBest() { const b = readBest(); $('bestStart').textContent = b ? 'Рекорд: ' + fmt(b) : ''; }

  function die() {
    state = 'dead'; stickReset();
    const t = Math.floor(G.t), best = readBest();
    $('dTime').textContent = fmt(t); $('dKills').textContent = G.kills; $('dLvl').textContent = G.level;
    if (t > best) { writeBest(t); $('bestDead').textContent = 'Новый рекорд!'; }
    else $('bestDead').textContent = best ? 'Рекорд: ' + fmt(best) : '';
    $('deadInv').innerHTML = weaponSlots() + relicSlots() + itemSlots();
    $('dead').hidden = false;
  }
  function startGame() {
    newGame(); state = 'play'; stickReset();
    ['start', 'dead', 'pause', 'levelup', 'chest'].forEach((id) => { $(id).hidden = true; });
    $('hud').hidden = false; $('toast').classList.remove('show');
    lastHud = {}; bumpLvl = 0; $('buffs').innerHTML = ''; renderInv(); showHint();
  }
  function setPause(on) {
    if (on && state === 'play') { state = 'pause'; stickReset(); hideHint(); renderPauseInv(); $('pause').hidden = false; }
    else if (!on && state === 'pause') { state = 'play'; $('pause').hidden = true; }
  }
  $('startBtn').addEventListener('click', startGame);
  $('againBtn').addEventListener('click', startGame);
  $('pauseBtn').addEventListener('click', () => setPause(true));
  $('resumeBtn').addEventListener('click', () => setPause(false));
  // Возврат в главное меню (там можно сменить героя)
  function goMenu() {
    state = 'menu'; stickReset(); hideHint();
    ['dead', 'pause', 'levelup', 'chest'].forEach((id) => { $(id).hidden = true; });
    $('hud').hidden = true; $('toast').classList.remove('show');
    renderHeroes(); showBest();
    $('start').hidden = false;
  }
  // Кнопка, которая просит нажать второй раз, чтобы случайно не сбросить забег
  function confirmBtn(id, label, action) {
    const b = $(id); let until = 0, timer = 0;
    b.addEventListener('click', () => {
      if (performance.now() < until) { until = 0; clearTimeout(timer); b.textContent = label; action(); return; }
      until = performance.now() + 2500; b.textContent = 'Точно? Нажми ещё раз';
      clearTimeout(timer); timer = setTimeout(() => { until = 0; b.textContent = label; }, 2500);
    });
  }
  confirmBtn('restartBtn', 'Заново', startGame);
  confirmBtn('menuBtn', 'Сменить героя', goMenu);
  $('deadMenuBtn').addEventListener('click', goMenu);
  document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });
  window.addEventListener('keydown', (e) => { if (e.code === 'Escape' || e.code === 'KeyP') setPause(state === 'play'); });

  let lastHud = {}, bumpLvl = 0;
  function setText(id, v) { if (lastHud[id] !== v) { lastHud[id] = v; $(id).textContent = v; } }
  function updateHud() {
    const g = G, p = g.p;
    setText('lvl', g.level); setText('timer', fmt(g.t)); setText('kills', g.kills);
    if (lastHud.doom !== g.doom) { lastHud.doom = g.doom; $('timer').classList.toggle('doom', g.doom); }
    const boss = g.enemies.find((e) => e.T.boss && !e.dead), bb = $('bossbar');
    if (boss) {
      if (bb.hidden) bb.hidden = false;
      setText('bossName', boss.T.name);
      $('bossFill').style.transform = 'scaleX(' + Math.max(0, boss.hp / boss.maxHp).toFixed(3) + ')';
    } else if (!bb.hidden) bb.hidden = true;
    setText('hptext', Math.ceil(Math.max(0, p.hp)) + ' / ' + p.maxHp);
    $('xpfill').style.transform = 'scaleX(' + Math.min(1, g.xp / g.need).toFixed(3) + ')';
    $('hpfill').style.transform = 'scaleX(' + Math.max(0, p.hp / p.maxHp).toFixed(3) + ')';
    if (g.level !== bumpLvl) {
      if (bumpLvl) { const el = $('lvbadge'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
      bumpLvl = g.level;
    }
    const key = (g.buffs.rage > 0 ? 'r' : '') + (g.buffs.haste > 0 ? 'h' : '');
    if (key !== g.buffKey) {
      g.buffKey = key; delete lastHud['bt-rage']; delete lastHud['bt-haste'];
      $('buffs').innerHTML = ['rage', 'haste'].filter((k) => g.buffs[k] > 0).map((k) =>
        '<span class="buff" style="--bc:' + PUS[k].col + '"><span class="bi">' + svg(PUS[k].icon) + '</span>' + PUS[k].name + ' <b id="bt-' + k + '"></b></span>').join('');
    }
    if (g.buffs.rage > 0) setText('bt-rage', Math.ceil(g.buffs.rage) + ' с');
    if (g.buffs.haste > 0) setText('bt-haste', Math.ceil(g.buffs.haste) + ' с');
  }

  /* =====================================================
     РИСОВАНИЕ
     ===================================================== */
  function drawGround(cx, cy) {
    const ox = -(((cx % TILE) + TILE) % TILE), oy = -(((cy % TILE) + TILE) % TILE);
    for (let x = Math.floor(ox); x < W; x += TILE) for (let y = Math.floor(oy); y < H; y += TILE) ctx.drawImage(tile, x, y, TILE + 0.5, TILE + 0.5);
    const cs = 120, ix0 = Math.floor(cx / cs) - 1, iy0 = Math.floor(cy / cs) - 1, nx = Math.ceil(W / cs) + 2, ny = Math.ceil(H / cs) + 2;
    for (let i = 0; i <= nx; i++) for (let j = 0; j <= ny; j++) {
      const gx = ix0 + i, gy = iy0 + j, h = hash(gx, gy);
      if (h > 0.17) continue;
      const spr = DECOR[Math.floor(hash(gx + 3, gy - 9) * DECOR.length)];
      const px = gx * cs + hash(gy + 7, gx - 3) * cs - cx, py = gy * cs + hash(gx + 11, gy + 5) * cs - cy;
      ctx.drawImage(spr, px - spr.w / 2, py - spr.h / 2, spr.w, spr.h);
    }
  }
  function blitGlow(spr, x, y, size, a) { ctx.globalAlpha = a; ctx.drawImage(spr, x - size / 2, y - size / 2, size, size); }
  function star4(x, y, r) {
    ctx.beginPath(); ctx.moveTo(x, y - r);
    ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
    ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill();
  }
  function rotT(a, x, y) { const c = Math.cos(a), s = Math.sin(a); ctx.setTransform(dpr * c, dpr * s, -dpr * s, dpr * c, dpr * x, dpr * y); }

  function draw(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    if (state === 'menu' || !G) {
      drawGround(now * 0.02, now * 0.012);
      if (vig) ctx.drawImage(vig, 0, 0, W, H);
      return;
    }
    const g = G, p = g.p, sk = g.shake > 0 ? g.shake * 26 : 0;
    const cx = p.x - hx + rnd(-sk, sk), cy = p.y - hy + rnd(-sk, sk), m = 80;
    const inView = (x, y, r) => x > -m - r && x < W + m + r && y > -m - r && y < H + m + r;
    drawGround(cx, cy);
    // выжженная земля от метеоритов
    for (let i = 0; i < g.fx.length; i++) {
      const q = g.fx[i]; if (q.type !== 'decal') continue;
      const x = q.x - cx, y = q.y - cy;
      ctx.globalAlpha = Math.min(1, q.life / 1.2) * 0.6;
      ctx.fillStyle = rg(ctx, x, y, 0, x, y, q.r, [[0, 'rgba(18,8,6,.95)'], [0.55, 'rgba(50,22,10,.55)'], [1, 'rgba(0,0,0,0)']]);
      ctx.beginPath(); ctx.ellipse(x, y, q.r, q.r * 0.62, 0, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, q.life / 3) * 0.5;
      ctx.fillStyle = '#ff7a2e';
      for (let k = 0; k < 5; k++) { const a = k * 1.3 + q.r, d = q.r * 0.45; star4(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.6, 2.5); }
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.globalAlpha = 1;

    // ядовитые лужи с пузырями
    for (let i = 0; i < g.puddles.length; i++) {
      const q = g.puddles[i], x = q.x - cx, y = q.y - cy; if (!inView(x, y, q.r)) continue;
      const a = Math.max(0, Math.min(1, q.life / 0.4, (q.T - q.life) / 0.2));
      const grow = Math.min(1, (q.T - q.life) / 0.25);
      const R = q.r * (0.6 + 0.4 * grow);
      if (q.kind === 'fire') {
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a * 0.85;
        ctx.fillStyle = rg(ctx, x, y, 0, x, y, R, [[0, 'rgba(255,170,60,.55)'], [0.7, 'rgba(255,90,30,.3)'], [1, 'rgba(255,60,20,0)']]);
        ctx.beginPath(); ctx.ellipse(x, y, R, R * 0.55, 0, 0, TAU); ctx.fill();
        for (let k = 0; k < 3; k++) {
          const fx = x + (k - 1) * R * 0.42, fh = R * (0.65 + 0.3 * Math.sin(now / 70 + k * 2 + i)) * a;
          ctx.fillStyle = k === 1 ? 'rgba(255,225,130,.85)' : 'rgba(255,120,40,.75)';
          ctx.beginPath(); ctx.moveTo(fx - R * 0.17, y);
          ctx.quadraticCurveTo(fx - R * 0.2, y - fh * 0.6, fx, y - fh);
          ctx.quadraticCurveTo(fx + R * 0.2, y - fh * 0.6, fx + R * 0.17, y); ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
        continue;
      }
      ctx.globalAlpha = a;
      ctx.fillStyle = rg(ctx, x, y, 0, x, y, R, [[0, 'rgba(130,255,90,.5)'], [0.75, 'rgba(60,200,70,.38)'], [1, 'rgba(40,140,50,0)']]);
      ctx.beginPath(); ctx.ellipse(x, y, R, R * 0.62, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(170,255,130,.6)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(x, y, R * (0.94 + Math.sin(now / 200 + i) * 0.04), R * 0.58, 0, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(210,255,180,.8)';
      for (let k = 0; k < 7; k++) {
        const ph = (now / 900 + k * 0.37 + i * 0.13) % 1, ang = k * 2.4 + i, d = R * 0.7 * ((k * 0.37 + 0.2) % 1);
        ctx.globalAlpha = a * (1 - ph);
        ctx.beginPath(); ctx.arc(x + Math.cos(ang) * d, y + Math.sin(ang) * d * 0.6 - ph * 7, 1.4 + ph * 3, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    // аура под всем
    if (g.w.aura) {
      const R = auraR(), x = p.x - cx, y = p.y - cy;
      ctx.globalCompositeOperation = 'lighter';
      blitGlow(GLOW.gold, x, y, R * 2.3, 0.28 + 0.06 * Math.sin(now / 200));
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      ctx.strokeStyle = 'rgba(255,224,150,.55)'; ctx.lineWidth = 2; ctx.setLineDash([10, 14]); ctx.lineDashOffset = -now * 0.03;
      ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,232,170,.9)';
      for (let k = 0; k < 8; k++) {
        const a = now / 900 + k * TAU / 8;
        rotT(a, x + Math.cos(a) * R, y + Math.sin(a) * R);
        ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(3, 0); ctx.lineTo(0, 6); ctx.lineTo(-3, 0); ctx.closePath(); ctx.fill();
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      for (let i = 0; i < g.fx.length; i++) {
        const q = g.fx[i]; if (q.type !== 'pulse') continue;
        const k = 1 - q.life / q.T;
        ctx.strokeStyle = 'rgba(255,220,140,' + (0.55 * (1 - k)).toFixed(2) + ')'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(x, y, R * (0.2 + 0.8 * k), 0, TAU); ctx.stroke();
      }
    }
    // предупреждения метеоритов
    for (let i = 0; i < g.meteors.length; i++) {
      const q = g.meteors[i], k = 1 - q.t / q.T, x = q.x - cx, y = q.y - cy;
      ctx.fillStyle = 'rgba(255,90,40,' + (0.08 + 0.18 * k).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(x, y, q.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,140,70,.7)'; ctx.lineWidth = 2; ctx.setLineDash([6, 8]);
      ctx.beginPath(); ctx.arc(x, y, q.r * (0.3 + 0.7 * k), 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    }
    // предупреждение: титан готовит удар по земле
    for (let i = 0; i < g.enemies.length; i++) {
      const e = g.enemies[i]; if (!(e.cast > 0)) continue;
      const x = e.x - cx, y = e.y - cy, k = 1 - e.cast / 1.1;
      ctx.fillStyle = 'rgba(120,190,255,' + (0.08 + 0.2 * k).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(x, y, 180, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(170,220,255,.85)'; ctx.lineWidth = 2.5; ctx.setLineDash([8, 8]);
      ctx.beginPath(); ctx.arc(x, y, 180 * (0.2 + 0.8 * k), 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    }
    // тени
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath();
    for (let i = 0; i < g.enemies.length; i++) {
      const e = g.enemies[i], x = e.x - cx, y = e.y - cy;
      if (!inView(x, y, e.r)) continue;
      const sy = y + e.r * (e.T.fly ? 1.25 : 0.82), sr = e.r * (e.T.fly ? 0.65 : 0.95);
      ctx.moveTo(x + sr, sy); ctx.ellipse(x, sy, sr, sr * 0.36, 0, 0, TAU);
    }
    ctx.moveTo(p.x - cx + 12, p.y - cy + 18); ctx.ellipse(p.x - cx, p.y - cy + 18, 12, 4.4, 0, 0, TAU);
    ctx.fill();
    // пыль из-под ног и дым
    for (let i = 0; i < g.fx.length; i++) {
      const q = g.fx[i]; if (q.type !== 'dust') continue;
      const k = 1 - q.life / q.T;
      ctx.fillStyle = 'rgba(' + q.col + ',' + (0.38 * (1 - k)).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(q.x - cx, q.y - cy, q.r * (1 + k * 1.4), 0, TAU); ctx.fill();
    }

    // кристаллы, сердечки, сундуки
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < g.gems.length; i++) {
      const q = g.gems[i]; if (q.type !== 'xp' || q.tier === 0) continue;
      const x = q.x - cx, y = q.y - cy; if (!inView(x, y, 0)) continue;
      blitGlow(q.tier === 1 ? GLOW.green : GLOW.red, x, y, 26, 0.5);
    }
    for (let i = 0; i < g.chests.length; i++) {
      const c = g.chests[i], x = c.x - cx, y = c.y - cy; if (!inView(x, y, 60)) continue;
      ctx.globalAlpha = 0.65 + 0.25 * Math.sin(now / 250);
      ctx.drawImage(BEAM, x - 18, y - 110, 36, 120);
      blitGlow(GLOW.gold, x, y, 70, 0.45);
    }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    for (let i = 0; i < g.gems.length; i++) {
      const q = g.gems[i], x = q.x - cx, y = q.y - cy + Math.sin(now / 300 + q.ph) * 1.5;
      if (!inView(x, y, 0)) continue;
      const s = q.type === 'heart' ? HEARTSPR : GEMS[q.tier];
      const sx = q.type === 'heart' ? 1 : 0.5 + 0.5 * Math.abs(Math.cos(now / 420 + q.ph));
      ctx.drawImage(s, x - s.w * sx / 2, y - s.h / 2, s.w * sx, s.h);
      const tw = Math.sin(now / 260 + q.ph * 3);
      if (tw > 0.92) {
        ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = '#ffffff'; ctx.globalAlpha = (tw - 0.92) / 0.08;
        star4(x + 3, y - 4, 4.5);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      }
    }
    for (let i = 0; i < g.chests.length; i++) {
      const c = g.chests[i], x = c.x - cx, y = c.y - cy - 4 + Math.sin(now / 320) * 2;
      if (!inView(x, y, 40)) continue;
      const wob = Math.sin(now / 70) * 0.07 * Math.max(0, Math.sin(now / 700));
      rotT(wob, x, y + 12);
      ctx.drawImage(CHEST, -CHEST.w / 2, -CHEST.h / 2 - 12, CHEST.w, CHEST.h);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = '#fff3c0';
      for (let k = 0; k < 3; k++) {
        const a = now / 700 + k * TAU / 3, tw = 0.5 + 0.5 * Math.sin(now / 180 + k * 2);
        ctx.globalAlpha = tw; star4(x + Math.cos(a) * 24, y - 6 + Math.sin(a) * 12, 3 + tw * 2.5);
      }
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
    // временные бонусы: крутятся как монетки
    for (let i = 0; i < g.pickups.length; i++) {
      const q = g.pickups[i];
      if (q.life < 5 && Math.floor(now / 120) % 2 === 0) continue;
      const x = q.x - cx, y = q.y - cy - 6 + Math.sin(now / 280 + q.ph) * 3;
      if (!inView(x, y, 30)) continue;
      const D = PUS[q.kind], sx = Math.max(0.18, Math.abs(Math.cos(now / 520 + q.ph)));
      ctx.globalCompositeOperation = 'lighter';
      blitGlow(GLOW[D.glow], x, y, 54, 0.65 + 0.25 * Math.sin(now / 150 + q.ph));
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      ctx.drawImage(D.spr, x - 15 * sx, y - 15, 30 * sx, 30);
    }

    // исчезающие тела врагов
    for (let i = 0; i < g.corpses.length; i++) {
      const q = g.corpses[i], k = q.t / q.life, x = q.x - cx, y = q.y - cy;
      if (!inView(x, y, 40)) continue;
      const sx = q.sc * (1 + k * 0.55), sy = q.sc * (1 - k * 0.65);
      ctx.globalAlpha = 1 - k;
      ctx.setTransform(dpr * q.flip * sx, 0, 0, dpr * sy, dpr * x, dpr * (y + q.img.h * q.sc * 0.35 - (q.fly ? 4 : 0)));
      ctx.drawImage(q.img, -q.img.w / 2, -q.img.h * 0.85, q.img.w, q.img.h);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = 1;

    // свечение элиты и заморозки
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < g.enemies.length; i++) {
      const e = g.enemies[i]; if (!e.elite && !e.T.boss && !e.T.doom && e.slow <= 0) continue;
      const x = e.x - cx, y = e.y - cy; if (!inView(x, y, e.r)) continue;
      if (e.elite || e.T.boss) blitGlow(GLOW.gold, x, y, e.r * 4, 0.45 + 0.15 * Math.sin(now / 180 + e.ph));
      if (e.T.doom) blitGlow(GLOW.red, x, y, e.r * 4.5, 0.6 + 0.2 * Math.sin(now / 120 + e.ph));
      if (e.slow > 0) blitGlow(GLOW.cyan, x, y, e.r * 3, 0.5);
    }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

    // враги и герой (сортировка по высоте)
    const order = [];
    for (let i = 0; i < g.enemies.length; i++) { const e = g.enemies[i], x = e.x - cx, y = e.y - cy; if (inView(x, y, e.r * 2)) order.push(e); }
    order.sort((a, b) => a.y - b.y);
    let heroDrawn = false;
    const t = now / 1000;
    for (let i = 0; i <= order.length; i++) {
      const e = order[i];
      if (!heroDrawn && (!e || e.y > p.y)) { drawPlayer(now); heroDrawn = true; }
      if (!e) break;
      const x = e.x - cx, y = e.y - cy;
      const spr = SPR[e.T.key], fi = Math.floor(t * e.T.fps + e.ph) & 3;
      const img = e.flash > 0 ? spr.w[fi] : spr.f[fi];
      const flip = p.x < e.x ? -1 : 1, b = e.born;
      const popK = b < 1 ? 1 - Math.pow(1 - b, 3) * Math.cos(b * 4) : 1;
      const sc = e.scale * popK, sxk = sc * (1 + e.sq * 0.24), syk = sc * (1 - e.sq * 0.2);
      const lift = e.T.fly ? 4 + Math.sin(t * 4 + e.ph) * 3 : 0;
      const rot = e.T.fly ? Math.sin(t * 3 + e.ph) * 0.09 : Math.sin(t * e.T.fps * 0.9 + e.ph * 1.6) * 0.08;
      const co = Math.cos(rot), si = Math.sin(rot);
      if (b < 1) ctx.globalAlpha = Math.min(1, b * 2.5);
      ctx.setTransform(dpr * co * flip * sxk, dpr * si * flip * sxk, -dpr * si * syk, dpr * co * syk, dpr * x, dpr * (y - lift + img.h * e.scale * 0.35));
      ctx.drawImage(img, -img.w / 2, -img.h * 0.85, img.w, img.h);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = 1;
